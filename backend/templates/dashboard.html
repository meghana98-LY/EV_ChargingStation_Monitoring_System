<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EV Charging Monitor</title><link rel="stylesheet" href="/static/css/style.css"></head><body><header><h1>EV Charging Station Monitor</h1><nav><a href="/dashboard">Dashboard</a><a href="/analytics">Analytics</a></nav></header><main class="grid">
<div class="card"><h3>Vehicle</h3><div id="vehicle" class="value">--</div></div><div class="card"><h3>Charging</h3><div id="charging" class="value">--</div></div><div class="card"><h3>Relay</h3><div id="relay" class="value">--</div></div><div class="card"><h3>Voltage</h3><div id="voltage" class="value">--</div></div><div class="card"><h3>Current</h3><div id="current" class="value">--</div></div><div class="card"><h3>Power</h3><div id="power" class="value">--</div></div><div class="card"><h3>Anomaly</h3><div id="anomaly" class="value">--</div></div><div class="card"><h3>Protection</h3><div id="protection" class="value">--</div></div><div class="card wide"><h3>Reason</h3><div id="reason" class="value">--</div></div><div class="card wide"><button id="reset">Reset Protection</button></div></main><script src="/static/js/dashboard.js"></script></body></html>
